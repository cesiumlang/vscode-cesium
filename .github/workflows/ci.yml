name: CI

# Builds, tests and packages the extension, modeled on zfls's ci.yml (#3).
# Pull requests into main and pushes to main are run. Pushes to dev and pull
# requests into it are not (emanspeaks, 2026-11-21; as zfls and rstd do): dev
# is checked as a whole by the standing pull request from dev to main, whose
# run each merge into dev restarts. To check one branch alone, start the
# workflow by hand: `gh workflow run ci.yml --ref BRANCH`.
#
# - Build: type check, the unit tests of the extension (plain Node.js), of
#   zcsls and of the Zig build tools, the generated files, and zcsls built
#   for every platform's target (`zig build stage-zcsls`), unsigned. Zig is
#   the devkit's (devkit-version), as in cesiumlang/cesium.
# - Sign: for a release, and a run started by hand with the `sign` input,
#   the Windows zcsls.exe are signed with Azure Artifact Signing (#40), by
#   the shared workflow of cesiumlang/.github; skipped while the SIGN_*
#   variables are unset, so the binaries stay unsigned, and a failed signing
#   fails the run. Signings are limited per month: never for a pull request.
# - Package: the VSIX files (`zig build package-vscode`) from those zcsls,
#   the signed ones in place of the unsigned: one per VS Code platform with
#   its zcsls in bin/, and the universal one without a server, kept as the
#   artifact `dist`.
# - Test: the platform VSIX of each runner, unpacked as VS Code installs
#   it, in a downloaded VS Code on Linux (under xvfb), macOS and Windows:
#   the extension activates, and its zcsls reports the error of a fixture,
#   with a cesium1 built from cesiumlang/cesium dev. If cesium1 cannot be
#   built, that part is skipped with a warning. Before it, `zig build test`
#   with the devkit of cesiumlang/cesium dev: the unit tests of zcsls and
#   its LSP test, on each platform.
# - CI: the one check the rulesets require.
#
# Versions: build.zig.zon holds the version of the next release. A push to
# main whose version is not tagged yet, once built and tested, is tagged and
# published as a GitHub pre-release with the VSIX; the publishing workflows
# (open-vsx.yml, marketplace.yml) are then started, and main is merged back
# into dev, where build.zig.zon gets the next patch version (version.sh,
# which also checks every place that states it on every run). While the
# server is zcsls every version is a pre-release, 0.<odd>.<patch> (#3); for
# a new minor version, run `bash .github/workflows/version.sh set X.Y.Z` on
# dev. A push to main whose version is already tagged is tested but not
# released.

on:
  push:
    # (not dev: see the top)
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Windows zcsls.exe, as a release does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      sign: ${{ steps.ver.outputs.sign }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request into main must carry an unreleased version, newer
      # than the latest tag
      - name: Work out the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_SIGN: ${{ inputs.sign }}
          SIGN_WINDOWS: ${{ vars.SIGN_AZURE_CLIENT_ID }}
        run: |
          # every place that states the version agrees (version.sh lists them)
          if ! version=$(bash .github/workflows/version.sh); then
            echo "::error file=build.zig.zon::the places that state the version disagree; see the log, and set them all with version.sh set"
            exit 1
          fi
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          latest=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)
          latest=${latest#v}
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [ -n "$latest" ]; then
            newest=$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)
            if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
              echo "::error file=build.zig.zon::.version is $version, but v$latest is already released. Set a newer version."
              exit 1
            fi
          fi

          release=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              # main moved on: the run for the newer commit releases it
              echo "main has moved past this commit; testing only" | tee -a "$GITHUB_STEP_SUMMARY"
            elif tagged "$version"; then
              echo "::warning::main holds v$version, which is already released; testing only. Set a newer version on dev and merge it."
            else
              release=true
            fi
          fi
          # signing: for a release, or a run started by hand that asks, once
          # it is configured
          sign=false
          if [ "$release" = true ] || { [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_SIGN" = true ]; }; then
            if [ -n "$SIGN_WINDOWS" ]; then
              sign=true
            else
              echo "::warning::signing is not configured (SIGN_AZURE_CLIENT_ID); zcsls.exe stays unsigned"
            fi
          fi
          sha=$(git rev-parse HEAD)
          {
            echo "version=$version"
            echo "release=$release"
            echo "sign=$sign"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "version $version at $sha; release: $release; sign: $sign" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # the grammar is a submodule
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install the dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      # the tests that need no VS Code, in plain Node.js
      - name: Unit tests
        run: npm run unit

      - uses: ./.github/actions/devkit-zig

      - name: Zig source is formatted (zig fmt)
        run: zig fmt --check build build.zig build.zig.zon server

      - name: Unit tests of zcsls and the build tools
        run: zig build test --summary failures

      # package.nls.json and l10n/bundle.l10n.json (build/generated.zig)
      - name: Generated files are up to date
        run: zig build check-generated

      # zig-out/zcsls/TARGET/; a tar keeps the execute bits
      - name: zcsls for every platform's target
        run: |
          zig build stage-zcsls --summary failures
          tar -C zig-out/zcsls -cf zcsls.tar .

      - uses: actions/upload-artifact@v7
        with:
          name: zcsls
          path: zcsls.tar
          if-no-files-found: error

      # the executables to sign, as x86_64-windows/zcsls.exe and so on
      - uses: actions/upload-artifact@v7
        with:
          name: zcsls-windows
          path: |
            zig-out/zcsls/x86_64-windows/
            zig-out/zcsls/aarch64-windows/
          if-no-files-found: error

  sign-windows:
    name: Sign zcsls.exe
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.version.outputs.sign == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: cesiumlang/.github/.github/workflows/sign-windows.yml@main
    with:
      artifact: zcsls-windows
      signed-artifact: zcsls-windows-signed
      count: 2
      run: x86_64-windows/zcsls.exe --version
      client-id: ${{ vars.SIGN_AZURE_CLIENT_ID }}
      tenant-id: ${{ vars.SIGN_AZURE_TENANT_ID }}
      subscription-id: ${{ vars.SIGN_AZURE_SUBSCRIPTION_ID }}
      endpoint: ${{ vars.SIGN_ENDPOINT }}
      account: ${{ vars.SIGN_ACCOUNT }}
      profile: ${{ vars.SIGN_PROFILE }}

  package:
    name: Package
    needs: [version, build, sign-windows]
    # unsigned when no signing was asked for; signed when it was
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.sign-windows.result == 'success'
      || (needs.version.outputs.sign != 'true' && needs.sign-windows.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNED: ${{ needs.sign-windows.result == 'success' }}
    steps:
      # the grammar is a submodule
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: ./.github/actions/devkit-zig

      - uses: actions/download-artifact@v8
        with:
          name: zcsls
          path: unsigned

      - uses: actions/download-artifact@v8
        if: env.SIGNED == 'true'
        with:
          name: zcsls-windows-signed
          path: signed

      - name: The zcsls to package
        run: |
          mkdir staged
          tar -C staged -xf unsigned/zcsls.tar
          if [ "$SIGNED" = true ]; then cp -R signed/. staged/; fi
          find staged -type f | sort

      - name: Package the extension
        run: zig build package-vscode -Dzcsls-dir=staged -- dist

      # a signing that succeeded must be what ships
      - name: The Windows packages carry the signed zcsls.exe
        if: env.SIGNED == 'true'
        run: |
          for p in win32-x64:x86_64-windows win32-arm64:aarch64-windows; do
            unzip -p "dist/vscode-cesium-v$VERSION-${p%%:*}.vsix" extension/bin/zcsls.exe > "$RUNNER_TEMP/zcsls.exe"
            cmp "$RUNNER_TEMP/zcsls.exe" "signed/${p#*:}/zcsls.exe"
            echo "${p%%:*}: the signed zcsls.exe"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: VS Code (${{ matrix.os }})
    needs: [version, package]
    # without this, a skipped sign-windows (every unsigned run) would skip
    # the tests too, since a job is skipped when one before it was
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: macos-15, platform: darwin-arm64 }
          - { os: windows-2025, platform: win32-x64 }
    env:
      CESIUM_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # cesium1 for the diagnostics test, built from cesiumlang/cesium dev
      # with its devkit: `zig build` installs it to zig-out/bin
      # (cesiumlang/cesium#81).
      - uses: actions/checkout@v7
        with:
          repository: cesiumlang/cesium
          ref: dev
          path: cesium-compiler

      # the devkit of cesiumlang/cesium dev, for cesium1 and for the tests of
      # zcsls on this platform
      - name: The devkit
        working-directory: cesium-compiler
        run: |
          bash tools/fetch-devkit.sh
          if ! cmp -s ../devkit-version devkit-version; then
            echo "::warning::cesiumlang/cesium dev uses devkit $(cat devkit-version), this repository $(cat ../devkit-version)"
          fi

      # The unit tests and the LSP test (server/_test/lsp_test.zig), which
      # drives the built zcsls as a plain client, on each platform
      - name: Tests of zcsls
        run: cesium-compiler/.devkit/zig/zig build test --summary failures

      - name: cesium1 from cesiumlang/cesium dev
        id: cesium1
        continue-on-error: true
        working-directory: cesium-compiler
        run: |
          .devkit/zig/zig build --summary failures
          exe=cesium1
          if [ "$RUNNER_OS" = Windows ]; then exe=cesium1.exe; fi
          if [ ! -f "zig-out/bin/$exe" ]; then
            echo "::error::zig build installed no $exe in zig-out/bin"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/compilers"
          cp "zig-out/bin/$exe" "$RUNNER_TEMP/compilers/"
          echo "$RUNNER_TEMP/compilers" >> "$GITHUB_PATH"

      - name: Without cesium1, the diagnostics test is skipped
        if: steps.cesium1.outcome != 'success'
        run: echo "::warning::cesium1 could not be built from cesiumlang/cesium dev; the diagnostics test is skipped"

      - name: VS Code's libraries and a display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libsecret-1-0

      # The runner's platform VSIX, with zcsls, unpacked as VS Code would
      # install it, in a downloaded VS Code (test/runTest.ts, test/suite.ts)
      - name: The packaged extension in VS Code
        env:
          VSIX: dist/vscode-cesium-v${{ needs.version.outputs.version }}-${{ matrix.platform }}.vsix
          CESIUM_DIAGNOSTICS: ${{ steps.cesium1.outcome == 'success' && '1' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/vsix"
          # unzip, else a bsdtar (Windows' tar.exe, macOS' tar), which reads zip
          if command -v unzip > /dev/null; then
            unzip -q "$VSIX" -d "$RUNNER_TEMP/vsix"
          elif [ -x /c/Windows/System32/tar.exe ]; then
            /c/Windows/System32/tar.exe -xf "$VSIX" -C "$RUNNER_TEMP/vsix"
          else
            tar -xf "$VSIX" -C "$RUNNER_TEMP/vsix"
          fi
          npm ci --no-audit --no-fund
          npm run build-test
          export CESIUM_EXTENSION_PATH="$RUNNER_TEMP/vsix/extension"
          run_vscode() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a node out/runTest.js
            else
              node out/runTest.js
            fi
          }
          # a VS Code window that hangs while starting on the runner fails
          # the run before the test begins; a broken extension fails both
          if ! run_vscode; then
            echo "::warning::the VS Code test failed; running it once more"
            run_vscode
          fi

      # what users install must be the signed program
      - name: The packaged zcsls.exe is signed (Windows)
        if: runner.os == 'Windows' && needs.version.outputs.sign == 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\vsix\extension\bin\zcsls.exe"
          $sig = Get-AuthenticodeSignature $exe
          "${exe}: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "the packaged zcsls.exe is not validly signed: $($sig.Status)" }

  # The check the rulesets require: passes when no job before it failed or
  # was cancelled
  ci-result:
    name: CI
    needs: [version, build, sign-windows, package, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Results of the jobs before
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi
          # packages that were made must have been tested
          if [ "$(echo "$RESULTS" | jq -r .package.result)" = success ] && [ "$(echo "$RESULTS" | jq -r .test.result)" != success ]; then
            echo "::error::the packages were made but not tested"
            exit 1
          fi

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, package, test]
    if: >-
      ${{ !cancelled() && needs.version.outputs.release == 'true'
      && needs.package.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check the packages
        run: |
          ls -l dist
          for p in universal win32-x64 win32-arm64 linux-x64 linux-arm64 alpine-x64 alpine-arm64 darwin-x64 darwin-arm64; do
            if [ ! -f "dist/vscode-cesium-v$VERSION-$p.vsix" ]; then
              echo "::error::no $p VSIX at version $VERSION"
              exit 1
            fi
          done

      - name: Tag the tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "vscode-cesium v$VERSION" "$SHA"
          git push origin "v$VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS)

      # every build while the server is zcsls is a pre-release (#3)
      - name: Publish the pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Cesium for VS Code v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: true

  # The next version is begun on dev: main keeps the version it released. A
  # separate job, so that a push dev refuses does not stop the publishing.
  begin-next-version:
    name: Merge v${{ needs.version.outputs.version }} into dev and begin the next version
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # A fast-forward when dev has not moved, else a merge commit
      - name: Merge into dev and begin the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          for attempt in 1 2 3; do
            git fetch -q --tags origin dev
            git checkout -q -B dev origin/dev
            if ! git merge -q -m "Merge v$VERSION into dev [skip ci]" "$SHA"; then
              git merge --abort
              echo "::error::v$VERSION conflicts with dev; merge main into dev by hand and set the next version"
              exit 1
            fi
            version=$(sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon)
            if tagged "$version"; then
              next=$version
              while tagged "$next"; do
                IFS=. read -r ma mi pa <<< "$next"
                next="$ma.$mi.$((pa + 1))"
              done
              # every place that states the version; the released changelog
              # section loses its "(unreleased)" and an empty one is begun
              bash .github/workflows/version.sh set "$next"
              git commit -qam "Begin v$next development [skip ci]"
            fi
            if git push -q origin dev; then exit 0; fi
            echo "dev moved while merging; trying again"
          done
          echo "::error::could not push to dev"
          exit 1

  publish-extension:
    name: Publish VS Code extension v${{ needs.version.outputs.version }}
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Each registry has its own workflow, which takes the packages from the
    # release: open-vsx.yml, the workflow Open VSX trusts by name, and
    # marketplace.yml, the one the Marketplace's Trusted Publishing policy
    # names. Both can also be run by hand for any released version.
    permissions:
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Start publishing to Open VSX and the Marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in open-vsx.yml marketplace.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f version="$VERSION"
          done
